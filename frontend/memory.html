<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1420" />
    <title>JARVIS · 記憶</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
    <link rel="stylesheet" href="/static/shell.css" />
    <link rel="stylesheet" href="/static/memory.css" />
    <script type="module" src="/static/shell.js"></script>
    <script type="module" src="/static/memory.js"></script>
  </head>
  <body class="memory-page">
    <div class="app-shell">
      <header class="app-header" data-app-header></header>

      <main class="memory-main">
        <p class="readonly-note" id="readonly-note">
          <strong>ローカル専用・読み取り専用</strong>
          <span class="note-line">この画面は保存された記憶ノートと確認待ちの候補を表示するだけで、承認・却下・編集・削除などの操作はできません。</span>
          <span class="note-line">LLM に渡されるのは、レビュー済みで現在も承認されているノートだけです。確認待ちや競合中の候補、却下・置換・撤回されたものは渡されません。</span>
          <span class="note-line">承認済みノートの本文は承認時点の記録です。Obsidian 上で編集された最新の本文とは異なる場合があります。</span>
        </p>

        <h1 id="list-heading">記憶</h1>
        <div class="filters" id="tabs" role="group" aria-label="表示する種類"></div>
        <div class="list-toolbar">
          <p class="list-status" id="list-status" role="status" aria-live="polite">読み込み中…</p>
          <button class="reload" id="reload" type="button">再読み込み</button>
        </div>
        <ul class="memory-list" id="memory-list" aria-labelledby="list-heading"></ul>
        <p class="list-note" id="list-note"></p>
      </main>
    </div>
  </body>
</html>
