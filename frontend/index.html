<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1420" />
    <title>JARVIS · Chat</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
    <link rel="stylesheet" href="/static/shell.css" />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/activity.css" />
    <script type="module" src="/static/shell.js"></script>
    <script type="module" src="/static/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header" data-app-header>
        <div class="model-select" id="model-select" hidden></div>
        <button class="new-chat" id="new-chat" type="button" aria-label="新しい会話を始める">
          <span aria-hidden="true">＋</span> 新しい会話
        </button>
      </header>

      <main class="chat" aria-label="JARVIS との会話">
        <div class="activity-mount" id="activity"></div>
        <div class="conversation" id="conversation" role="log" aria-label="会話履歴" aria-live="polite" aria-relevant="additions text">
          <section class="welcome" id="welcome">
            <span class="welcome-mark" aria-hidden="true">J</span>
            <h1>何をお手伝いしましょうか。</h1>
            <p>相談、質問、作業の依頼をここから始められます。</p>
          </section>
        </div>
      </main>

      <div class="composer-wrap">
        <div class="composer-inner">
          <p class="status" id="status" role="status" aria-live="polite"></p>
          <form class="composer" id="chat-form" novalidate>
            <label class="sr-only" for="message">JARVIS へのメッセージ</label>
            <textarea id="message" name="message" rows="1" maxlength="4000" placeholder="メッセージを入力"></textarea>
            <button id="stop" class="stop" type="button" aria-label="応答を停止する" hidden>停止</button>
            <button id="send" type="submit" aria-label="メッセージを送信する">送信</button>
          </form>
          <p class="counter" id="counter" hidden></p>
          <p class="hint">Enter で送信 · Shift + Enter で改行</p>
        </div>
      </div>
    </div>
  </body>
</html>
