<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1420" />
    <title>JARVIS · 承認</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
    <link rel="stylesheet" href="/static/shell.css" />
    <link rel="stylesheet" href="/static/approvals.css" />
    <script type="module" src="/static/shell.js"></script>
    <script type="module" src="/static/approvals.js"></script>
  </head>
  <body class="approvals-page">
    <div class="app-shell">
      <header class="app-header" data-app-header></header>

      <main class="approvals-main">
        <h1 id="approvals-heading" tabindex="-1">承認待ち</h1>
        <p class="readonly-note">
          <strong>操作はあなたの判断だけで実行されます</strong>
          承認は 1 回限りで、表示された内容と完全に同じ呼び出しにだけ有効です。期限が切れた依頼は自動的に拒否扱いになります。
        </p>
        <p class="list-status" id="status" role="status" aria-live="polite">読み込み中…</p>
        <ul class="approval-list" id="approval-list" aria-labelledby="approvals-heading"></ul>
      </main>
    </div>
  </body>
</html>
