[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Foundation for a personal JARVIS assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
openai = ["openai>=2,<3"]
search = ["httpx>=0.27,<1"]
vector = ["chromadb>=1.5,<2"]
local-embedding = ["torch==2.9.1", "transformers==4.57.6", "sentencepiece==0.2.1"]
dev = [
  "httpx>=0.27,<1",
  "openai>=2,<3",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
